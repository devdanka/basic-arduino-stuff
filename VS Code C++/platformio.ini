[platformio]
default_envs = esp32

; Defaults below are the Arduino Uno setup. The ESP32 env at the bottom
; overrides platform/board/lib_deps for itself.
[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = -<*>
lib_deps =
    arduino-libraries/Servo
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    chris--a/Keypad
    z3t0/IRremote@^4.4.1
    simsso/ShiftRegister74HC595@^1.3.1

[env:led]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/000-SetLEDBrightness/000-SetLEDBrightness.cpp>

[env:servo-input]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/001-InputServoValue/001-InputServoValue.cpp>

[env:servo]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/002-PhotoDetectingServo/002-PhotoDetectingServo.cpp>

[env:dht11]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/003.DHT11/003.DHT11.cpp>

[env:lcd-i2c]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/004-LCDI2C/004-LCDI2C.cpp>

[env:ultrasonic]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/005-Ultrasonic/005-Ultrasonic.cpp>

[env:servo-sweep]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/006-ServoSweep/006-ServoSweep.cpp>

[env:radar]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/007-Radar/007-Radar.cpp>

[env:ir-remote]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/008-IRRemote/008-IRRemote.cpp>

[env:servo-remote]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/009-ServoRemote/009-ServoRemote.cpp>

[env:74hc595]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/010-74HC595/010-74HC595.cpp>

[env:relay-remote]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/011-RelayModule/011-RelayModule.cpp>

[env:relay-photoresistor]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/012-RelayPhotoresistor/012-RelayPhotoresistor.cpp>

[env:triggers]
build_src_filter = ${env.build_src_filter} +<Arduino Uno/013-Triggers/013-Triggers.cpp>

; ---------------------------------------------------------------------------
; ESP32
; board = esp32dev is the generic DevKit V1 / WROOM-32 (30- or 38-pin).
; If yours is a different module, swap the board line for one of:
;   board = esp32-s3-devkitc-1     ; ESP32-S3
;   board = esp32-c3-devkitm-1     ; ESP32-C3
;   board = esp32doit-devkit-v1    ; DOIT DevKit V1
;   board = nodemcu-32s            ; NodeMCU-32S
; Full list: https://docs.platformio.org/en/latest/boards/index.html#espressif-32
; lib_deps is blanked out because the AVR libs above (esp. Servo) don't build
; for ESP32 - add ESP32-specific ones here as you need them.
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
monitor_speed = 115200
; Turns a crash dump's raw addresses into file names and line numbers.
monitor_filters = esp32_exception_decoder
; Auto-detect usually works. Uncomment and set these only if the board is not
; found, or if you have more than one board plugged in. Check the real port
; name with: pio device list
;upload_port = COM3
;monitor_port = COM3
lib_deps =
build_src_filter = ${env.build_src_filter} +<ESP32/000-blinkingLED/000-blinkingLED.cpp>
