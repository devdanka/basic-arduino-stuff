[env:servo-remote]
build_src_filter = ${env.build_src_filter} +<Basics of Arduino Uno/009-ServoRemote/009-ServoRemote.cpp>

[env:74hc595]
build_src_filter = ${env.build_src_filter} +<Basics of Arduino Uno/010-74HC595/010-74HC595.cpp>

[env:relay-remote]
