[platformio]
default_envs = esp32

[env]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*>
lib_deps =
    arduino-libraries/Servo
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    chris--a/Keypad
    z3t0/IRremote@^4.4.1
    simsso/ShiftRegister74HC595@^1.3.1
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes

[esp32_base]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder

[esp32_air]
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = --auth=YOUR_OTA_PASSWORD

[esp32_bt]
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/bt_upload.py" --password YOUR_OTA_PASSWORD "$SOURCE"

[env:led]
build_src_filter = ${env.build_src_filter} +<Basics of Arduino Uno/000-SetLEDBrightness/000-SetLEDBrightness.cpp>

[env:servo-input]
build_src_filter = ${env.build_src_filter} +<Basics of Arduino Uno/001-InputServoValue/001-InputServoValue.cpp>

[env:servo]
